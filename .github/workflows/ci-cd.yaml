name: CI/CD – Build, Push & Deploy Wisecow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: mohamedaakhil/wisecow

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 – Build & push Docker image to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 – Validate Kubernetes manifests (dry-run, no cluster needed)
  # ─────────────────────────────────────────────────────────────────────────────
  verify-manifests:
    name: Verify Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl

      - name: Validate namespace manifest
        run: kubectl apply -f k8s/namespace.yaml --dry-run=client --validate=false

      - name: Validate deployment manifest
        run: kubectl apply -f k8s/deployment.yaml --dry-run=client --validate=false

      - name: Validate service manifest
        run: kubectl apply -f k8s/service.yaml --dry-run=client --validate=false

      - name: Validate ingress manifest
        run: kubectl apply -f k8s/ingress.yaml --dry-run=client --validate=false

      - name: Print deployed image info
        run: |
          echo "✅ Image built and pushed successfully:"
          echo "   ghcr.io/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)"
          echo "   ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "📦 To deploy on local Minikube run:"
          echo "   kubectl apply -f k8s/"
