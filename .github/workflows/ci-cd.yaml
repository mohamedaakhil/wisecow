name: CI/CD – Build, Push & Verify Wisecow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: mohamedaakhil/wisecow

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 – Build & push Docker image to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 – Verify Kubernetes manifests (no cluster needed)
  # ─────────────────────────────────────────────────────────────────────────────
  verify-manifests:
    name: Verify Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all Kubernetes YAML files
        run: |
          yamllint -d relaxed k8s/namespace.yaml
          yamllint -d relaxed k8s/deployment.yaml
          yamllint -d relaxed k8s/service.yaml
          yamllint -d relaxed k8s/ingress.yaml
          yamllint -d relaxed k8s/cluster-issuer.yaml

      - name: Check all required manifests exist
        run: |
          echo "Checking required Kubernetes manifest files..."
          test -f k8s/namespace.yaml     && echo "✅ namespace.yaml found"
          test -f k8s/deployment.yaml    && echo "✅ deployment.yaml found"
          test -f k8s/service.yaml       && echo "✅ service.yaml found"
          test -f k8s/ingress.yaml       && echo "✅ ingress.yaml found"
          test -f k8s/cluster-issuer.yaml && echo "✅ cluster-issuer.yaml found"
          test -f Dockerfile             && echo "✅ Dockerfile found"
          test -f wisecow.sh             && echo "✅ wisecow.sh found"
          test -f tls/generate-tls-secret.sh && echo "✅ generate-tls-secret.sh found"
          echo ""
          echo "✅ All required files present!"

      - name: Print image info
        run: |
          echo "✅ Docker image built and pushed:"
          echo "   ghcr.io/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)"
          echo "   ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "📦 To deploy on Minikube:"
          echo "   minikube start --driver=virtualbox"
          echo "   kubectl apply -f k8s/"
          echo "   minikube service wisecow-service -n wisecow"
