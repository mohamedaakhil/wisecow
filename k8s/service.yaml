apiVersion: v1
kind: Service
metadata:
  name: wisecow-service
  namespace: wisecow
  labels:
    app: wisecow
spec:
  selector:
    app: wisecow
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 4499
    - name: http
      protocol: TCP
      port: 80
      targetPort: 4499
  type: LoadBalancer   # use NodePort for Minikube / Kind (see comment below)
  # ── For Minikube / Kind ───────────────────────────────────────────────────
  # type: NodePort
  # ports:
  #   - name: http
  #     protocol: TCP
  #     port: 4499
  #     targetPort: 4499
  #     nodePort: 30499
