# =============================================================================
# Zero-Trust KubeArmor Security Policy Suite
# Project   : wisecow (https://github.com/mohamedaakhil/wisecow)
# Namespace  : wisecow
# Selector   : app=wisecow
# Mode       : Audit (compatible with Minikube/Windows – logs all violations)
# =============================================================================

---
# POLICY 1 – AUDIT UNAUTHORISED PROCESS EXECUTION
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: zt-wisecow-audit-pkg-managers
  namespace: wisecow
spec:
  tags: ["zero-trust", "wisecow", "process", "audit"]
  message: "ZT AUDIT: Package manager / download tool execution detected"
  severity: 9
  selector:
    matchLabels:
      app: wisecow
  process:
    matchPaths:
      - path: /usr/bin/apt
      - path: /usr/bin/apt-get
      - path: /usr/bin/apt-cache
      - path: /usr/bin/dpkg
      - path: /usr/bin/curl
      - path: /usr/bin/wget
      - path: /usr/bin/python3
      - path: /usr/bin/python
      - path: /usr/bin/pip3
      - path: /usr/bin/whoami
      - path: /usr/bin/id
      - path: /usr/bin/nc
      - path: /bin/nc
  action: Audit

---
# POLICY 2 – AUDIT KUBERNETES SERVICE-ACCOUNT TOKEN ACCESS
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: zt-wisecow-audit-sa-token
  namespace: wisecow
spec:
  tags: ["zero-trust", "wisecow", "k8s-api", "lateral-movement"]
  message: "ZT AUDIT: K8s service-account token accessed – possible API pivot"
  severity: 10
  selector:
    matchLabels:
      app: wisecow
  file:
    matchDirectories:
      - dir: /run/secrets/kubernetes.io/serviceaccount/
        recursive: true
  action: Audit

---
# POLICY 3 – AUDIT WRITES TO SYSTEM DIRECTORIES
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: zt-wisecow-audit-system-dirs
  namespace: wisecow
spec:
  tags: ["zero-trust", "wisecow", "file-integrity"]
  message: "ZT AUDIT: Write to system directory detected in wisecow pod"
  severity: 8
  selector:
    matchLabels:
      app: wisecow
  file:
    matchDirectories:
      - dir: /etc/
        recursive: true
      - dir: /bin/
        recursive: false
      - dir: /usr/bin/
        recursive: false
  action: Audit

---
# POLICY 4 – AUDIT SHELL HISTORY TAMPERING
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: zt-wisecow-audit-history-tamper
  namespace: wisecow
spec:
  tags: ["zero-trust", "wisecow", "forensics", "anti-tamper"]
  message: "ZT AUDIT: Shell history modification detected"
  severity: 6
  selector:
    matchLabels:
      app: wisecow
  file:
    matchPaths:
      - path: /root/.bash_history
      - path: /root/.sh_history
  action: Audit

---
# POLICY 5 – AUDIT RAW NETWORK SOCKET CREATION
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: zt-wisecow-audit-raw-sockets
  namespace: wisecow
spec:
  tags: ["zero-trust", "wisecow", "network", "raw-socket"]
  message: "ZT AUDIT: Raw network socket creation detected in wisecow pod"
  severity: 8
  selector:
    matchLabels:
      app: wisecow
  network:
    matchProtocols:
      - protocol: raw
      - protocol: tcp
  action: Audit

---
# POLICY 6 – AUDIT TLS CERTIFICATE ACCESS
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: zt-wisecow-audit-tls-certs
  namespace: wisecow
spec:
  tags: ["zero-trust", "wisecow", "audit", "tls", "secrets"]
  message: "ZT AUDIT: TLS certificate/key accessed in wisecow pod"
  severity: 5
  selector:
    matchLabels:
      app: wisecow
  file:
    matchDirectories:
      - dir: /certs/
        recursive: true
  action: Audit

---
# POLICY 7 – AUDIT /etc/passwd AND SENSITIVE FILE ACCESS
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: zt-wisecow-audit-sensitive-files
  namespace: wisecow
spec:
  tags: ["zero-trust", "wisecow", "audit", "sensitive-files"]
  message: "ZT AUDIT: Sensitive file access detected in wisecow pod"
  severity: 7
  selector:
    matchLabels:
      app: wisecow
  file:
    matchPaths:
      - path: /etc/passwd
      - path: /etc/shadow
      - path: /etc/hosts
      - path: /etc/hostname
  action: Audit
