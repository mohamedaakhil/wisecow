# ──────────────────────────────────────────────────────────────────────────────
# KubeArmor Zero-Trust Policy for Wisecow Application
# Implements least-privilege / zero-trust security posture
# Ref: https://docs.kubearmor.io/kubearmor/
# ──────────────────────────────────────────────────────────────────────────────

---
# Policy 1: Block execution of sensitive binaries
# Prevents attackers from running shells or package managers inside the pod
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-block-exec
  namespace: wisecow
spec:
  selector:
    matchLabels:
      app: wisecow
  process:
    matchPaths:
      - path: /bin/sh
        action: Block
      - path: /bin/bash
        action: Block
      - path: /usr/bin/python3
        action: Block
      - path: /usr/bin/apt
        action: Block
      - path: /usr/bin/apt-get
        action: Block
      - path: /usr/bin/wget
        action: Block
      - path: /usr/bin/curl
        action: Block
      - path: /usr/bin/nc
        action: Block
      - path: /usr/bin/ncat
        action: Block
  action: Block

---
# Policy 2: Block access to sensitive files and directories
# Prevents reading /etc/passwd, /etc/shadow, SSH keys etc.
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-block-sensitive-files
  namespace: wisecow
spec:
  selector:
    matchLabels:
      app: wisecow
  file:
    matchPaths:
      - path: /etc/passwd
        action: Block
      - path: /etc/shadow
        action: Block
      - path: /etc/sudoers
        action: Block
      - path: /root/.ssh/
        action: Block
      - path: /proc/sysrq-trigger
        action: Block
    matchDirectories:
      - dir: /etc/kubernetes/
        action: Block
      - dir: /var/run/secrets/kubernetes.io/
        recursive: true
        action: Audit   # Audit instead of block — app needs service account token
  action: Block

---
# Policy 3: Block raw network socket access
# Prevents network scanning and raw packet crafting
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-block-raw-network
  namespace: wisecow
spec:
  selector:
    matchLabels:
      app: wisecow
  network:
    matchProtocols:
      - protocol: raw
        action: Block
      - protocol: packet
        action: Block
  action: Block

---
# Policy 4: Block write to system binaries (file integrity)
# Prevents attackers from modifying /bin, /sbin, /usr/bin
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-file-integrity
  namespace: wisecow
spec:
  selector:
    matchLabels:
      app: wisecow
  file:
    matchDirectories:
      - dir: /bin/
        readOnly: true
        recursive: true
      - dir: /sbin/
        readOnly: true
        recursive: true
      - dir: /usr/bin/
        readOnly: true
        recursive: true
      - dir: /usr/sbin/
        readOnly: true
        recursive: true
      - dir: /usr/games/
        readOnly: false   # cowsay/fortune live here — needs read+exec
        recursive: true
  action: Block

---
# Policy 5: Audit all capability usage (zero-trust visibility)
# Logs any attempt to use Linux capabilities
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-audit-capabilities
  namespace: wisecow
spec:
  selector:
    matchLabels:
      app: wisecow
  capabilities:
    matchCapabilities:
      - capability: net_admin
        action: Block
      - capability: sys_admin
        action: Block
      - capability: sys_ptrace
        action: Block
      - capability: dac_override
        action: Audit
  action: Audit
