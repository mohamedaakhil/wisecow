apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  namespace: wisecow
  labels:
    app: wisecow
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wisecow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wisecow
    spec:
      containers:
        - name: wisecow
          image: ghcr.io/mohamedaakhil/wisecow:latest   # replaced by CI/CD
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4499
              protocol: TCP
          env:
            - name: PORT
              value: "4499"
            - name: TLS_CERT
              value: "/certs/tls.crt"
            - name: TLS_KEY
              value: "/certs/tls.key"
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            tcpSocket:
              port: 4499
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 4499
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-certs
          secret:
            secretName: wisecow-tls       # created by cert-manager or manually
            optional: true                # app falls back to plain HTTP if absent
      imagePullSecrets:
        - name: ghcr-secret              # secret for pulling from GHCR
